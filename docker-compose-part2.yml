version: "3.9"

services:
  mongo2:
    image: mongo:6
    container_name: bookies-mongo2
    restart: always
    ports:
      - "28017:27017"
    volumes:
      - mongo_data2:/data/db

  backend2:
    image: node:18-alpine
    container_name: bookies-backend2
    working_dir: /app
    restart: always
    depends_on:
      - mongo2
    ports:
      - "6000:5000"
    volumes:
      - ./server:/app
    command: sh -c "npm install && node app.js"
    environment:
      MONGO_DB_URI: mongodb://mongo2:27017/bookiesdb
      PORT: 5000

  frontend2:
    image: node:18-alpine
    container_name: bookies-frontend2
    working_dir: /app
    restart: always
    depends_on:
      - backend2
    ports:
      - "4000:3000"
    volumes:
      - ./client:/app
    command: sh -c "npm install && npm run dev -- --host"

volumes:
  mongo_data2:
