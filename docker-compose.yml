version: "3.9"

services:
  mongo:
    image: mongo:6
    container_name: bookies-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./server
    container_name: bookies-backend
    restart: always
    depends_on:
      - mongo
    ports:
      - "5000:5000"
    environment:
      MONGO_URL: mongodb://mongo:27017/bookiesdb

  frontend:
    build: ./client
    container_name: bookies-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mongo_data:
